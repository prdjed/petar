<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Petar</title>
    <style>
      @font-face {
        font-family: "Zadnja Klupa";
        src: url("fonts/ZadnjaKlupa-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Zadnja Klupa";
        src: url("fonts/ZadnjaKlupa-Bold.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --ink: #211f1a;
        --muted: #686052;
        --paper: #f1ede7;
        --line: rgba(33, 31, 26, 0.16);
        --red: #c74335;
        --green: #245f4b;
        --blue: #284f82;
        --gold: #9d6d25;
        --hero-image-height: 82vh;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 18% 24%,
            rgba(255, 255, 255, 0.85) 0 1px,
            transparent 2px
          ),
          radial-gradient(
            circle at 72% 31%,
            rgba(205, 198, 181, 0.1) 0 1px,
            transparent 2px
          ),
          radial-gradient(
            circle at 38% 68%,
            rgba(188, 180, 158, 0.1) 0 1px,
            transparent 2px
          ),
          linear-gradient(
            96deg,
            rgba(255, 255, 255, 0.28),
            rgba(224, 218, 202, 0.14) 42%,
            rgba(255, 255, 255, 0.2)
          ),
          linear-gradient(var(--paper), var(--paper));
        background-size:
          5px 5px,
          12px 12px,
          12px 12px,
          100% 100%,
          100% 100%;
        color: var(--ink);
        font-family: "Zadnja Klupa", ui-serif, Georgia, serif;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      body::before {
        opacity: 0.22;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(154, 145, 126, 0.08) 0 1px,
            transparent 2px 8px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.35) 0 1px,
            transparent 2px 8px
          );
        mix-blend-mode: multiply;
      }

      body::after {
        opacity: 0.28;
        background:
          radial-gradient(
            ellipse at 50% 50%,
            transparent 0 58%,
            rgba(211, 204, 186, 0.2) 100%
          ),
          radial-gradient(
            circle at 25% 18%,
            rgba(255, 255, 255, 0.42),
            transparent 34%
          ),
          radial-gradient(
            circle at 78% 76%,
            rgba(209, 201, 184, 0.16),
            transparent 32%
          );
      }

      main {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: row;
        min-height: 100vh;
      }

      .sections {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1 1 0;
        min-height: 100vh;
        padding: 40px;
      }

      nav {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: clamp(18px, 3.5vh, 34px);
        width: fit-content;
        max-width: 100%;
      }

      nav a {
        position: relative;
        display: inline-flex;
        align-items: center;
        width: fit-content;
        max-width: none;
        color: var(--ink);
        font-size: clamp(34px, 5vw, 72px);
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: 0;
        white-space: nowrap;
        text-decoration: none;
        transition: color 180ms ease;
      }

      nav a .label {
        display: inline-block;
        transform: translateX(0);
        transition: transform 220ms ease;
      }

      nav a::before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        width: 0.7em;
        height: 0.7em;
        opacity: 0;
        background: url("glavar_bold.png") center / contain no-repeat;
        transform: translateY(-50%) scale(0.82);
        pointer-events: none;
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      nav a:hover .label,
      nav a:focus-visible .label {
        transform: translateX(0.72em);
      }

      nav a:hover::before,
      nav a:focus-visible::before {
        opacity: 1;
        transform: translateY(calc(-50% + 0.2em)) scale(1);
      }

      nav a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 8px;
      }

      .visual {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1 1 0;
        min-height: 100vh;
        overflow: hidden;
      }

      .visual img {
        display: block;
        width: auto;
        height: var(--hero-image-height);
        max-width: 100%;
        object-fit: contain;
      }

      @media (max-width: 760px) {
        main {
          position: relative;
          flex-direction: column;
          min-height: 100vh;
        }

        main::before {
          content: "";
          position: absolute;
          top: 24px;
          left: 24px;
          z-index: 1;
          width: 40px;
          height: 40px;
          background: url("glavar_bold.png") center / contain no-repeat;
        }

        .visual {
          display: none;
        }

        .sections {
          min-height: 100vh;
          padding: 40px 24px;
        }

        nav {
          gap: 18px;
        }

        nav a {
          max-width: 100%;
          white-space: normal;
        }

        nav a::before {
          content: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="sections" aria-label="Site sections">
        <nav>
          <a href="about.html"><span class="label">About me</span></a>
          <a href="projects.html"><span class="label">Projects</span></a>
          <!-- <a href="#petar-clone-ai"><span class="label">Petar Clone</span></a> -->
          <a href="arts.html"><span class="label">Art</span></a>
        </nav>
      </section>
      <aside class="visual" aria-hidden="true">
        <img src="petar_hatch.png" alt="" />
      </aside>
    </main>
  </body>
</html>
